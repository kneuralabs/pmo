  const weeks = ["W18", "W19", "W20", "W21", "W22", "W23", "W24", "W25", "W26", "W27", "W28", "W29"];
  const todayCol = 3;
  const lanes = [
    { lbl: "Change requests", events: [
      { w: 0.5, type: "check" }, { w: 2.4, type: "change" },
      { w: 3.2, type: "change", hot: true }, { w: 5.0, type: "change" }, { w: 7.5, type: "change", soft: true }
    ]},
    { lbl: "Decisions", events: [
      { w: 0.2, type: "decision" }, { w: 1.0, type: "decision" }, { w: 1.8, type: "decision" },
      { w: 3.4, type: "decision", hot: true }, { w: 6.0, type: "decision", soft: true }
    ]},
    { lbl: "Stage gates", events: [
      { w: 1.0, type: "gate" }, { w: 3.8, type: "gate", hot: true }, { w: 4.5, type: "gate" }, { w: 8.2, type: "gate", soft: true }
    ]},
    { lbl: "Boards & audits", events: [
      { w: 0.6, type: "people" }, { w: 3.0, type: "people", hot: true },
      { w: 5.5, type: "alert", red: true }, { w: 9.0, type: "people", soft: true }
    ]},
  ];

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      <div style={{ display: "grid", gridTemplateColumns: "140px 1fr", gap: 12 }}>
        <div />
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${weeks.length}, 1fr)`, borderBottom: "1px solid var(--border)" }}>
          {weeks.map((w, i) => (
            <div key={i} style={{ borderRight: i < weeks.length - 1 ? "1px solid var(--border-soft)" : "none", textAlign: "center", padding: "5px 0", fontSize: 10, fontWeight: 500, color: i === todayCol ? "var(--precision-red)" : "var(--text-meta)" }}>{w}</div>
          ))}
        </div>
      </div>

      <div style={{ flex: 1, display: "grid", gridTemplateColumns: "140px 1fr", gridAutoRows: "1fr", rowGap: 8, columnGap: 12, marginTop: 12, position: "relative" }}>
        <div style={{ position: "absolute", left: `calc(140px + 12px + ${((todayCol + 0.5) / weeks.length) * 100}%)`, top: 0, bottom: 0, width: 2, background: "var(--precision-red)", opacity: 0.5, zIndex: 5 }} />

        {lanes.map((lane, i) => (
          <React.Fragment key={i}>
            <div className="w-label" style={{ alignSelf: "center", fontSize: 10 }}>{lane.lbl}</div>
            <div style={{ position: "relative", borderBottom: "1px solid var(--border-soft)" }}>
              <svg style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }} preserveAspectRatio="none">
                <line x1="0%" y1="50%" x2="100%" y2="50%" stroke="var(--frost-gray)" strokeWidth="1" strokeDasharray="3,4" />
              </svg>
              {lane.events.map((e, j) => (
                <FlowDot key={j} pct={(e.w / weeks.length) * 100} type={e.type} red={e.red} hot={e.hot} soft={e.soft} />
              ))}
            </div>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

function FlowDot({ pct, type, red, hot, soft }) {
  const color = red ? "var(--precision-red)" : hot ? "var(--royal-blue)" : "var(--ink-charcoal)";
  return (
    <div style={{
      position: "absolute",
      left: `calc(${pct}% - 13px)`,
      top: "50%",
      transform: "translateY(-50%)",
      width: 26, height: 26,
      background: hot ? color : "#fff",
      border: `1.5px solid ${color}`,
      borderRadius: 5,
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      boxShadow: hot ? "0 0 0 3px rgba(28, 92, 170, 0.12)" : "none",
      opacity: soft ? 0.4 : 1,
      zIndex: 4,
    }}>
      <Icon name={type} size={14} color={hot ? "#fff" : color} />
    </div>
  );
}

function Summary({ title, stat, sub, tone, items }) {
  return (
    <div className="w-box" style={{ borderLeft: `3px solid ${tone}` }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div className="w-h sm">{title}</div>
        <div style={{ font: "700 28px/1 var(--font)", letterSpacing: "-0.025em", color: tone, fontVariantNumeric: "tabular-nums" }}>{stat}</div>
      </div>
      <div className="w-meta" style={{ marginTop: 6 }}>{sub}</div>
      <ul style={{ margin: "12px 0 0", padding: 0, listStyle: "none", display: "flex", flexDirection: "column", gap: 4 }}>
        {items.map((it, i) => <li key={i} style={{ fontSize: 13, color: "var(--text-body)" }}>· {it}</li>)}
      </ul>
    </div>
  );
}

Object.assign(window, { RiverHome, RiverProject, RiverFlow });

/* global React, ReactDOM, DesignCanvas, DCSection, DCArtboard,
   Intro,

   RiverHome, RiverProject, RiverFlow,
   PulseInbox,

  "showRiver": true,

  React.useEffect(() => {

  }, [tweaks.persona]);

  return (

      <DesignCanvas>

          <DCArtboard id="intro-cover" label="Cover" width={1400} height={920}>

          </DCArtboard>

        {tweaks.showBriefing && (
          <DCSection id="briefing" title="Direction 1 — Briefing (recommended)">

              <BriefingHome />
            </DCArtboard>
            <DCArtboard id="b-project" label="Engagement file" width={1360} height={840}>

              <RiverHome />
            </DCArtboard>
            <DCArtboard id="r-project" label="Engagement lane" width={1360} height={840}>
              <RiverProject />
            </DCArtboard>
            <DCArtboard id="r-flow" label="Governance flow" width={1360} height={840}>

        {tweaks.showInbox && (

      <TweaksPanel title="Wireframe controls">

              { value: "Advisor", label: "Advisor" },
            ]}
          />
          <div style={{ fontSize: 11, color: "#777", marginTop: 4 }}>

          </div>
        </TweakSection>

        <TweakSection label="Sections">
          <TweakToggle label="01 · Briefing" value={tweaks.showBriefing} onChange={(v) => setTweak("showBriefing", v)} />
          <TweakToggle label="02 · Atlas" value={tweaks.showAtlas} onChange={(v) => setTweak("showAtlas", v)} />
          <TweakToggle label="03 · River" value={tweaks.showRiver} onChange={(v) => setTweak("showRiver", v)} />
          <TweakToggle label="Appendix · Inbox" value={tweaks.showInbox} onChange={(v) => setTweak("showInbox", v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);


</script>
